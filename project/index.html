<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">
    <div id="website">
        <div id="side">
            <h1 id="logo">🌱MOSS</h1>
            <h2 class="text"> ◷ Focus</h2>
            <h2 class="text">🌲My Forest</h2>
            <h2 class="text"> ▥ Statistics</h2>
            <h2 class="text"> ⚙ Settings</h2>
        </div>
        <div id="main">
            <div>
                <div id="header">
                    <h1>Welcome back!</h1>
                    <p>Ready to grow your forest today?</p>
                </div>
                <div id="profile">
                    🌿 Focus Mode
                </div>
            </div>
            <div id="timecard">
                <h1 id="h1time">Time to Focus</h1>
                <h1 id="time">25:00</h1>
                <p class="timetext">Every minute helps your forest grow</p>
                <div id="buttons">
                    <button id="start">Start</button>
                    <button id="reset">Reset</button>
                </div>
                <p class="timetext">🌱 One completed session = one new tree</p>
            </div>
            <div id="progresscard">
                <div></div>
            </div>
        </div>

    </div>
    <script src="project.js"></script>
</body>
</html>
